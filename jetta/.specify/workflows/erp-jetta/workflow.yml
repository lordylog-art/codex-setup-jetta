schema_version: "1.0"
workflow:
  id: "erp-jetta"
  name: "ERP Jetta — feature aprovada"
  version: "1.0.0"
  author: "ERP Jetta"
  description: "SpecKit com descoberta do ERP, aprovações explícitas e análise antes da implementação"

requires:
  speckit_version: ">=0.15.2"
  integrations:
    any:
      - "codex"

inputs:
  spec:
    type: string
    required: true
    prompt: "Descreva a feature, correção ou operação desejada"
  integration:
    type: string
    default: "auto"
    prompt: "Integração a usar; auto usa Codex configurado no projeto"

steps:
  - id: specify
    command: speckit.specify
    integration: "{{ inputs.integration }}"
    input:
      args: "{{ inputs.spec }}"

  - id: clarify
    command: speckit.clarify
    integration: "{{ inputs.integration }}"
    input:
      args: "{{ inputs.spec }}"

  - id: approve-erp-contract
    type: gate
    message: "Aprove o Contrato ERP: escopo, precedentes, fluxos preservados, matriz de impacto e decisões de produto/operação."
    options: [approve, reject]
    on_reject: abort

  - id: plan
    command: speckit.plan
    integration: "{{ inputs.integration }}"
    input:
      args: "{{ inputs.spec }}"

  - id: approve-erp-plan
    type: gate
    message: "Aprove o plano ERP: compatibilidade, regras, dados, jobs, integrações, segurança, deploy e estratégia de validação."
    options: [approve, reject]
    on_reject: abort

  - id: tasks
    command: speckit.tasks
    integration: "{{ inputs.integration }}"
    input:
      args: "{{ inputs.spec }}"

  - id: analyze
    command: speckit.analyze
    integration: "{{ inputs.integration }}"
    input:
      args: "{{ inputs.spec }}"

  - id: approve-erp-tasks
    type: gate
    message: "Aprove as tarefas analisadas antes de implementar. Escopo novo, efeito externo ou lacuna crítica exige voltar à etapa responsável."
    options: [approve, reject]
    on_reject: abort

  - id: implement
    command: speckit.implement
    integration: "{{ inputs.integration }}"
    input:
      args: "{{ inputs.spec }}"
