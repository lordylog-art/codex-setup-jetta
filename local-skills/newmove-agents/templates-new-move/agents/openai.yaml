interface:
  display_name: "Templates New Move"
  short_description: "Templates e protótipos de todas as telas do escopo"
  default_prompt: "Priorize a direção visual do Estúdio: menos texto, cards úteis, ilustrações semânticas e interações locais, sem métricas decorativas nem APIs adicionais. Use $templates-new-move para revisar todas as telas do escopo no Estúdio existente, com composições internas distintas, os mesmos dados mockados realistas por opção e ajustes independentes. Explore as alternativas úteis sem quantidade fixa. Após grooming confirmado ou pedido de protótipo visual, gere a prévia com voz e JSON. Pedido somente de protótipo usa prototypeOnly: true."
